name: Web_Ci
on:
  pull_request:
    paths: ["Web_Admin/**", "Web_Public/**", ".github/workflows/Web_Ci.yml"]
  push:
    branches: [main]
    paths: ["Web_Admin/**", "Web_Public/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [Web_Admin, Web_Public]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

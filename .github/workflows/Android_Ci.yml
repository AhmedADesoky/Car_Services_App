name: Android_Ci
on:
  pull_request:
    paths: ["Android_App/**", ".github/workflows/Android_Ci.yml"]
  push:
    branches: [main]
    paths: ["Android_App/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android_App
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug testDebugUnitTest --stacktrace
